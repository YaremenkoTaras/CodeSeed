server:
  port: 4000 # Gateway listens on port 4000

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://host.docker.internal:4001
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        # Route for /api/patients/** to user-service
        - id: user-service-route
          uri: http://host.docker.internal:4002
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
            - JwtValidation

        # Route for /api/docs/patients to user-service /v3/api-docs
        - id: api-docs-user-route
          uri: http://host.docker.internal:4002
          predicates:
            - Path=/api-docs/users
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs

        - id: api-docs-auth-route
          uri: http://host.docker.internal:4001
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth,/v3/api-docs
